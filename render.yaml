services:
  - type: web
    name: tometa-ocr-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: APP_SECRET
        sync: false
      - key: MAX_PAGES
        value: "30"          # taranmış PDF'te işlenecek en fazla sayfa
      - key: OCR_DPI
        value: "200"         # düşük = hızlı/az bellek, yüksek = daha iyi okuma
